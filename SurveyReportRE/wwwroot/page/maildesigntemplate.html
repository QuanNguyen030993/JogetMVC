<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<title>TMIV Template Designer</title>

<link rel="stylesheet"
href="https://unpkg.com/grapesjs/dist/css/grapes.min.css">


<style>

html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    font-family:Arial;
}


#app{

    display:flex;

    height:100vh;

}



/* LEFT PANEL */

#field-panel{

    width:220px;

    background:#f5f5f5;

    border-right:1px solid #ddd;

    padding:12px;

    box-sizing:border-box;

    overflow:auto;

}




.field{

    background:white;

    border:1px solid #ccc;

    padding:10px;

    margin-bottom:10px;

    border-radius:6px;

    cursor:grab;

}



.field:active{

    cursor:grabbing;

}





#designer{

    flex:1;

    height:100%;

}




#gjs{

    height:100%;

}



</style>

</head>


<body>



<div id="app">



    <div id="field-panel">


        <h3>
        Database Fields
        </h3>



        <div class="field"
        draggable="true"
        data-field="checkerName">

        Checker Name

        </div>



        <div class="field"
        draggable="true"
        data-field="makerName">

        Maker Name

        </div>



        <div class="field"
        draggable="true"
        data-field="shortName">

        Client Name

        </div>



        <div class="field"
        draggable="true"
        data-field="shortLocationName">

        Location

        </div>



        <div class="field"
        draggable="true"
        data-field="typeCheckerApprove">

        Approval Type

        </div>


        <br>


        <button onclick="saveTemplate()">
        Save
        </button>


        <button onclick="preview()">
        Preview
        </button>



    </div>





    <div id="designer">

        <div id="gjs">


            <h2>
            Approval Mail
            </h2>


            <p>
            Dear {{checkerName}}
            </p>


            <p>
            Your report was approved!
            </p>


            <p>
            Client:
            {{shortName}}
            </p>


        </div>


    </div>



</div>




<script src="https://unpkg.com/grapesjs"></script>


<script>


const editor =
grapesjs.init({

    container:"#gjs",

    height:"100%",


    fromElement:true,


    storageManager:false


});





// field component

editor.DomComponents.addType(
"tmiv-field",
{

model:{


defaults:{


tagName:"span",

content:"{{field}}",


attributes:{


"data-bind":"",

"class":"tmiv-field"

}


}



}


});






document
.querySelectorAll(".field")
.forEach(el=>{


el.addEventListener(
"dragstart",
e=>{


e.dataTransfer.setData(
"field",
el.dataset.field
);


});


});





const body =
editor.Canvas.getBody();



body.addEventListener(
"dragover",
e=>{

e.preventDefault();

});




body.addEventListener(
"drop",
e=>{


e.preventDefault();



let field =
e.dataTransfer.getData("field");



if(field){


editor.addComponents({

type:"tmiv-field",

content:
"{{"+field+"}}",

attributes:{

"data-bind":field

}


});


}



});





function saveTemplate(){


console.log(
editor.getProjectData()
);


alert("Saved");


}





function preview(){


let html =
editor.getHtml();



let data={

checkerName:"Nguyễn Văn A",

shortName:"ABC Insurance"

};



html =
html.replace(
/\{\{(.*?)\}\}/g,
(_,k)=>data[k.trim()]||_
);



let w=window.open("");

w.document.write(html);


}



</script>


</body>
</html>
